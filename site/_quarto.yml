project:
  type: website
  output-dir: _site
  resources:
    - "data/*.csv"
    - "data/*.json"
    - "config/*.yaml"
    - "config/curated/*.yaml"
    - "js/*.js"

website:
  # No website title: Quarto would append " – KEEL" to every browser title. Each page sets
  # pagetitle "[Page] · KEEL", and the navbar carries the name.
  description: Indicators of Gradual Human Disempowerment
  site-url: https://richardsonlj12.github.io/keel/
  navbar:
    title: KEEL
    left:
      - href: index.qmd
        text: Summary
      - text: Indicators
        menu:
          - href: indicators/EA1.qmd
            text: "Firm AI adoption (EA1)"
          - href: indicators/EA2.qmd
            text: "Automation vs. augmentation (EA2)"
          - href: indicators/ED1.qmd
            text: "Labor share of income (ED1)"
          - href: indicators/GD1.qmd
            text: "Labor-based share of tax revenue (GD1)"
          - href: indicators/CD1.qmd
            text: "Human knowledge-commons activity (CD1)"
      - href: methodology.qmd
        text: Methodology
      - href: sources.qmd
        text: Sources
      - href: archive.qmd
        text: Archive
      - href: about.qmd
        text: About
  page-footer:
    center: "by Jeremy Richardson · [Substack](https://richardsonlj.substack.com/)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 3
    link-external-newwindow: false
    lang: en
    respect-user-color-scheme: true
