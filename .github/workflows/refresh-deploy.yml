name: Refresh data and deploy

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time: two runs must not race on committing data/.
concurrency:
  group: refresh-deploy
  cancel-in-progress: false

# Triggers:
#   schedule / manual run: refresh -> build -> deploy
#   push to main:          build -> deploy (refresh is skipped)
#   refresh job failure:   build is skipped, so nothing deploys
jobs:
  refresh:
    # Only the schedule and a manual run refresh data; a push to main just rebuilds and deploys.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Refresh every source
        id: refresh
        # A failing source must not stop the workflow: the runner isolates sources, writes
        # data/_health.json and exits 1 if any failed. Failures become issues below.
        run: |
          set +e
          python -m indicators.refresh
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
            # A human push may have landed since checkout: rebase onto it, retrying once.
            git pull --rebase origin main && git push origin HEAD:main \
              || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open an issue for each failing source
        if: steps.refresh.outputs.exit_code != '0'
        # Notification only: a gh or parsing error here must never block build and deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/_health.json ] || { echo "No data/_health.json; nothing to report."; exit 0; }
          failed=$(python -c "import json; print('\n'.join(n for n, r in json.load(open('data/_health.json'))['sources'].items() if r.get('status') == 'failed'))")
          for source in $failed; do
            export TITLE="Data source failing: $source"
            existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq '[.[] | select(.title == env.TITLE)] | length')
            if [ "$existing" = "0" ]; then
              error=$(python -c "import json,sys; print(json.load(open('data/_health.json'))['sources'][sys.argv[1]].get('error', 'unknown error'))" "$source")
              gh issue create --title "$TITLE" \
                --body "The scheduled refresh could not update \`$source\`: $error. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            else
              echo "Open issue already exists for $source."
            fi
          done

  build:
    needs: refresh
    # Runs after a successful refresh, and also when refresh was skipped (push to main).
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The refresh job's data commit, or the latest main when refresh was skipped (push).
          ref: ${{ needs.refresh.outputs.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m indicators.pages
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - run: quarto render site
      - run: python scripts/link_check.py site/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    needs: build
    # Also runs when refresh was skipped (push to main), where a plain needs would still pass.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
