# Counter-evidence panel: signals pointing away from disempowerment, held to the same
# standard as the indicators (spec Sec. 4.6). Only items with verified: true are published.
inclusion_criteria: >-
  The inclusion criteria were written before any items were added. An item is included only
  if it meets all four: (1) **Primary source.** It comes from a primary source (the
  statistical agency, legislature or authors who produced the figure), which we opened and
  checked, with a link. (2) **Dated.** It is dated, with the period it covers stated.
  (3) **Measured.** It is a measured value or a counted event, not an opinion or a press
  paraphrase. (4) **Points away.** It points away from disempowerment in one of two ways:
  policy pushback (governments or institutions acting to keep human control, such as AI laws
  passed), or data that move the opposite way to what the disempowerment scenario predicts.
  Material welfare, such as rising incomes, is not counted. Welfare is not agency: people can
  be better off while losing influence (see [Welfare is not
  influence](methodology.qmd#welfare-is-not-influence)). **Items are kept even if they are
  small or later reverse.** An item whose figure cannot be verified stays in the project's
  records, marked unverified with the reason, and is not published. **No claim that AI caused
  it.** Inclusion says nothing about whether AI caused the signal.
panel_note: >-
  Few items meet all four criteria so far; the panel will grow as evidence does.
items:
  - id: ai_legislation_counts
    kind: policy
    label: "Laws about AI enacted: 25 US national laws, 2016 to 2025, and 150 US state laws in 2025 (Stanford AI Index 2026)"
    domain: government
    metric: AI-related bills passed into law, Policy and Governance chapter
    value:
      us_federal_bills_2016_2025: 25
      us_state_bills_enacted_2025: 150
    unit: count
    date: 2025-12-31
    source_name: Stanford HAI, AI Index Report 2026, Chapter 8 Policy and Governance (data from Digital Policy Alert and the AI Index)
    source_url: https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_8_policy_and_governance.pdf
    source_key: sajadieh2026
    locator: 341, 343  # printed pages of the two quoted sentences (see note)
    caveat: >-
      These are laws whose subject is AI, not laws drafted or generated by AI. The count includes laws that promote or fund AI as well as laws that restrict it, so it shows policy activity, not how far these laws keep human control.
    verified: true
    verified_on: 2026-11-17
    note: >-
      Read from the chapter PDF on 2026-11-17. PDF page 19 (printed 341): "Between 2016 and 2025,
      the United States passed the most AI-related bills, 25 in total, followed by South Korea
      with 17" (Figures 8.4.1 to 8.4.3, G20 countries, Digital Policy Alert; enacted bills only,
      and an omnibus bill counts once). PDF page 21: "Across all states, the total number of
      AI-related bills passed increased from fewer than 10 in 2020 to 150 in 2025" (Figure 8.4.4,
      page 22). These count laws enacted, which says nothing about whether they restrain AI or how
      well they are enforced; a count of laws is shown as a signal of policy activity only.
