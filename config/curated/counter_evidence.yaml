# Counter-evidence panel: signals pointing away from disempowerment, held to the same
# standard as the indicators (spec Sec. 4.6). Only items with verified: true are published.
inclusion_criteria: >-
  Written before items were added. An item is included only if (1) it comes from a
  primary source (the statistical agency, legislature, or authors who produced the figure),
  opened and checked by us, with a link to that source; (2) it is dated, with the period
  it covers stated; (3) it is a measured value or a counted event, not an opinion or a
  press paraphrase; and (4) it points away from disempowerment, either as a policy pushback
  (governments or institutions acting to retain human control) or as a data signal that moves
  against the hypothesized mechanism. Material welfare (for example income) is not counted:
  people can be better off while losing control. Items are not removed because they are small or reverse later; a failed or
  unverifiable check leaves the item in the file with verified: false and the reason, and
  it is not published. Inclusion says nothing about whether the signal is caused by AI.
items:
  - id: oecd_labor_tax_share
    kind: data_signal
    label: Labor-based taxes remain about half of OECD tax revenue
    domain: government
    metric: Personal income tax plus social security contributions, share of total tax revenue, OECD average
    value: 49.2
    unit: percent
    date: 2023-12-31
    source_name: OECD Revenue Statistics (OECD average, dataflow DF_RSOECD)
    source_url: https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_REV_COMP_OECD@DF_RSOECD,2.0/OECD_REP.TAX_REV.S13.T_1100+T_2000._T.PT_OTR_SECTOR.A?startPeriod=2010&endPeriod=2023
    verified: true
    verified_on: 2026-11-17
    note: >-
      23.736 (personal income tax) + 25.463 (social contributions) = 49.20 percent in 2023,
      against 48.53 in 2010 and a peak of 50.54 in 2020 (re-fetched from the OECD SDMX API on
      2026-11-17). The rise since 2010 is modest (0.7 points) and uneven, so this is shown
      as a level that has not fallen, not as a strong upward trend. No AI attribution is implied.
  - id: ai_legislation_counts
    kind: policy
    label: AI-related laws enacted - 25 US national bills 2016-2025 and 150 state bills in 2025 (Stanford AI Index 2026)
    domain: government
    metric: AI-related bills passed into law, Policy and Governance chapter
    value:
      us_federal_bills_2016_2025: 25
      us_state_bills_enacted_2025: 150
    unit: count
    date: 2025-12-31
    source_name: Stanford HAI, AI Index Report 2026, Chapter 8 Policy and Governance (data from Digital Policy Alert and the AI Index)
    source_url: https://hai.stanford.edu/assets/files/ai_index_report_2026_chapter_8_policy_and_governance.pdf
    verified: true
    verified_on: 2026-11-17
    note: >-
      Read from the chapter PDF on 2026-11-17. PDF page 19 (printed 341): "Between 2016 and 2025,
      the United States passed the most AI-related bills, 25 in total, followed by South Korea
      with 17" (Figures 8.4.1 to 8.4.3, G20 countries, Digital Policy Alert; enacted bills only,
      and an omnibus bill counts once). PDF page 21: "Across all states, the total number of
      AI-related bills passed increased from fewer than 10 in 2020 to 150 in 2025" (Figure 8.4.4,
      page 22). These count laws enacted, which says nothing about whether they restrain AI or how
      well they are enforced; a count of laws is shown as a signal of policy activity only.
