# Owner-approved comparison sites for C1 (selection record: review/c1-comparison-site-selection.md).
criteria: |
  1. Launched before 2015, defined as open_beta_date < 2015-01-01 (the API's launch_date is unreliable:
     it is often the graduation date or a bulk placeholder). Why: long pre-period for parallel-trends checks.
  2. Average at least 300 new questions a month in 2019. Why: keeps monthly count noise small enough to
     detect a year-over-year change of several percent.
  3. Subject matter is not programming, software, IT, data/statistics or math-computation, and not a
     quantitative homework-style site. Why: those populations are directly exposed to coding assistants.
  4. Subject matter is mostly experiential, physical-world, creative or community-specific, so a text
     chatbot is a weaker substitute than for coding. Operationally: not a language site and not an
     advice/professional site. Judged from the topic only, not from outcomes.
  5. A normal, active main site (site_type=main_site, site_state=normal); not a meta or StackApps site.
approved_by_owner: true
approved_on: 2026-11-17
selection_record: review/c1-comparison-site-selection.md
