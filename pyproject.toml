[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-indicators"
version = "0.1.0"
description = "Indicators of AI-driven gradual disempowerment from free public data"
requires-python = ">=3.12"
dependencies = ["pandas", "requests", "pyyaml", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "responses"]
browser = ["playwright"]  # release-gate link check only (uses the installed Chrome); not installed by CI

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network", "release_gate: blocks release (Task 12), not development; run with pytest -m release_gate"]
addopts = "-m 'not live and not release_gate'"
